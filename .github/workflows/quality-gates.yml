name: Quality gates

# The five Rust quality gates from AGENTS.md (mokevnin/dev-quality-gates#rust),
# executed through the very `mise.toml` tasks developers run locally. Keeping a
# single source of truth for tool versions and commands means CI cannot drift
# from `mise run gates`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    name: mise quality gates
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # Debug info is not needed in CI: dropping it cuts codegen time and keeps
      # the cached `target/` directory roughly 40% smaller.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # mise-action caches only its own data directory, while rustup keeps the
      # toolchain in ~/.rustup. Without this cache the 1.100.0 toolchain and its
      # components are downloaded again on every run.
      - name: Cache the rustup toolchain
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      # Installs Rust 1.100.0, cargo-deny 0.22.0, cargo-machete 0.10.1 and cmake
      # at the versions pinned in mise.toml.
      - name: Install pinned toolchain
        uses: jdx/mise-action@v5

      # The registry and target/ directory are the expensive part: clippy and
      # the test suite share one compilation profile inside this job.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: gates

      # Cheap, compile-free checks first so a formatting or dependency mistake
      # fails the run before the toolchain spends minutes building.
      - name: rustfmt
        run: mise run fmt-check

      - name: cargo-machete (unused dependencies)
        run: mise run machete

      - name: cargo-deny (advisories, licenses, bans, sources)
        run: mise run deny

      # clippy and the test suite share one compilation pass: clippy-driver is
      # the workspace rustc wrapper, so the crate is linted while it is built
      # for the tests instead of being checked and then rebuilt.
      - name: clippy + cargo test (single compilation pass)
        run: mise run lint-test
