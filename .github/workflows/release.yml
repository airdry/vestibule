name: Release

# Publishing is the only workflow that touches a registry or a GitHub Release.
# It runs for `v*` tags and, after a `workflow_dispatch`, only from the `release`
# environment, which is configured with required reviewers: the image is never
# published without a human approval.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  REGISTRY: ghcr.io

jobs:
  gates:
    name: Quality gates
    uses: ./.github/workflows/quality-gates.yml

  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.crate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The image tag and the crate version must not drift: `v1.0.0` may only be
      # released from a Cargo.toml that declares `version = "1.0.0"`.
      - name: Compare tag with crate version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "crate=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "Releasing $RELEASE_TAG (crate version $version)."

  publish:
    name: Publish image to GHCR
    needs: [gates, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/vestibule
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A 0.x release is not a stable line: it gets its own version and minor
      # tags plus the commit tag, but no major tag and no `latest` — a pre-1.0
      # build must never become what `:latest` resolves to.
      - name: Compute image tags
        id: meta
        run: |
          version="${{ needs.verify.outputs.version }}"
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          revision=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short HEAD)
          image="$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/vestibule"

          tags=("$image:$version" "$image:${version%.*}")
          if [ "${version%%.*}" != "0" ]; then
            tags+=("$image:${version%%.*}" "$image:latest")
          fi
          tags+=("$image:sha-$short_sha")

          taglist=$(printf ', %s' "${tags[@]}")

          {
            echo "image=$image"
            echo "created=$created"
            echo "revision=$revision"
            echo "short_sha=$short_sha"
            echo "taglist=${taglist#, }"
            echo "tags<<TAGS"
            printf '%s\n' "${tags[@]}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      # Pushed only after the release environment approval. Two exporters run in
      # one build: the registry (the public package) and a local tarball that is
      # attached to the GitHub Release for download without a registry login.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          outputs: |
            type=registry
            type=docker,dest=${{ runner.temp }}/vestibule-image.tar
          labels: |
            org.opencontainers.image.title=vestibule
            org.opencontainers.image.description=HTTP rate-limiting and buffering proxy for self-hosted Sentry
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Container image (public, no login required to pull):

            ```bash
            docker pull ${{ steps.meta.outputs.image }}:${{ needs.verify.outputs.version }}
            ```

            Tags: ${{ steps.meta.outputs.taglist }}

            The same image is attached below as a `docker load`-able tarball.
          files: ${{ runner.temp }}/vestibule-image.tar

      - name: Report published image
        run: |
          {
            echo "### Published"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
