# cargo-deny configuration for sentry-ratelimiter.
# See https://embarkstudios.github.io/cargo-deny/ for documentation.

[graph]
# Keep the dependency graph in sync with Cargo.lock.
all-features = true

# ---------------------------------------------------------------- advisories

[advisories]
version = 2
yanked = "deny"

# ------------------------------------------------------------------ licenses

[licenses]
version = 2
# Send and Relay are OK with these licenses; pingora (Apache-2.0) is the core
# building block. Anything incompatible fails the gate.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "0BSD",
  "NCSA",
]
confidence-threshold = 0.93

# --------------------------------------------------------------------- bans

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# ------------------------------------------------------------------- sources

[sources]
# Only crates.io is allowed as a dependency source.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
