[package]
name = "sentry-ratelimiter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
brotli = "8"
bytes = "1.12.2"
crc32fast = "1.5.5"
flate2 = "1"
pingora = { version = "0.9.1", features = ["proxy"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
url = { version = "2.5.9", features = ["serde"] }

[dev-dependencies]
flate2 = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
rstest = "0.29.0"
tempfile = "3.27.0"
