# Tool versions are pinned for reproducible local development.
# Run `mise install` after cloning, then `mise run` to list tasks.

[tools]
# Pingora MSRV is 1.85 (rolling 6-month policy); pin latest stable.
# The profile and components are pinned because mise installs the toolchain with
# rustup's configured profile: GitHub runners bootstrap rustup with
# `--profile=minimal`, so without this the gates fail with "'cargo-fmt' is not
# installed for the toolchain" (and clippy would fail the same way).
rust = { version = "1.100.0", profile = "minimal", components = ["rustfmt", "clippy"] }
# Quality gates from AGENTS.md (mokevnin/dev-quality-gates#rust).
cargo-deny = "0.22.0"
# Use the prebuilt release binary: the `cargo:` backend compiles the crate and
# therefore needs a host C toolchain, which breaks `mise run sample-apps` on
# machines that only run the Docker stack.
"github:bnjbvr/cargo-machete" = "0.10.1"
cmake = "3"
# Runs the sample-apps traffic generator (sample-apps/traffic.py).
uv = "0.13.10"

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "rustfmt check (quality gate)"
run = "cargo fmt --all --check"

[tasks.lint]
description = "clippy with warnings denied (quality gate)"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.machete]
description = "Find unused dependencies (quality gate)"
run = "cargo machete"

[tasks.deny]
description = "cargo-deny: advisories, licenses, bans (quality gate)"
run = "cargo deny check"

[tasks.test]
description = "Run all tests"
run = "cargo test --all"

[tasks.gates]
description = "Run every quality gate in CI order (fmt-check, machete, deny, lint, test)"
# An ordered `run` array instead of `depends`: `depends` entries run in parallel
# (up to `jobs`), which makes clippy and the test suite contend for the same
# cargo `target/` lock and hides which gate failed first. The array runs the
# gates one at a time and stops at the first failure, matching the order the CI
# workflow uses: compile-free checks before the expensive build.
run = [
  { task = "fmt-check" },
  { task = "machete" },
  { task = "deny" },
  { task = "lint" },
  { task = "test" },
]

[tasks.sample-apps]
description = "Build and start the sample applications with Docker Compose"
dir = "sample-apps"
run = "docker compose up -d --build"

[tasks.sample-apps-build]
description = "Build the sample application images with Docker Compose"
dir = "sample-apps"
run = "docker compose build"

[tasks.sample-apps-logs]
description = "Follow the sample application logs"
dir = "sample-apps"
run = "docker compose logs -f"

[tasks.sample-apps-traffic]
description = "Generate continuous traffic against the sample applications"
dir = "sample-apps"
run = "uv run traffic.py"

[tasks.sample-apps-down]
description = "Stop the sample applications"
dir = "sample-apps"
run = "docker compose down"
