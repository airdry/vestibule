name: sentry-ratelimiter-sample-apps

x-sample-app: &sample-app
  restart: unless-stopped
  init: true
  stop_grace_period: 15s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  depends_on:
    sentry-ratelimiter:
      condition: service_started
  environment:
    # Service name inside this Compose network, not host.docker.internal.
    SENTRY_DSN: ${SENTRY_DSN:-http://public@sentry-ratelimiter:8080/1}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-sample-apps}
    SENTRY_RELEASE: ${SENTRY_RELEASE:-sample-apps@local}
    LOG_LEVEL: ${LOG_LEVEL:-debug}

services:
  sentry-ratelimiter:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${RATELIMITER_DATA_PORT:-8080}:8080"
      - "${RATELIMITER_ADMIN_PORT:-8081}:8081"
    volumes:
      - ./sentry-ratelimiter.yaml:/etc/sentry-ratelimiter/config.yaml:ro
      - sentry-ratelimiter-queue:/var/lib/sentry-ratelimiter/queue

  fastapi:
    <<: *sample-app
    build:
      context: ./fastapi
    ports:
      - "${FASTAPI_PORT:-8001}:8000"

  fastify:
    <<: *sample-app
    build:
      context: ./fastify
    ports:
      - "${FASTIFY_PORT:-8002}:3000"

  fiber:
    <<: *sample-app
    build:
      context: ./fiber
    ports:
      - "${FIBER_PORT:-8003}:8080"

volumes:
  sentry-ratelimiter-queue:
